[project]
name = "materials-activity-assessor"
version = "0.1.0"
description = "Reproducible environment for materials data science training activities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pathlib>=1.0.1",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "xlrd>=2.0,<3",
]

[tool.uv]
package = false
